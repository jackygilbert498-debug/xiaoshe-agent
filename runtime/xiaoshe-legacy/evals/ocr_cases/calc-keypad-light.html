<!DOCTYPE html>
<!-- OCR 盲区回归用例：计算器式稀疏按钮（浅色）。孤立数字字形=WinRT 已知盲区（2026-07-23 探针矩阵钉死）。
     纯文本用例源可入 git；渲染图现跑现生成、不落 git（截图隐私铁律）。 -->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ocr-case calc-keypad-light</title>
<style>
  body { margin: 0; background: #f3f3f3; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
  .calc { width: 560px; margin: 40px auto; background: #ffffff; border-radius: 12px; padding: 24px;
          box-shadow: 0 2px 12px rgba(0,0,0,.18); }
  .history { text-align: right; color: #666; font-size: 22px; min-height: 28px; padding-right: 12px; }
  .display { text-align: right; color: #111; font-size: 72px; font-weight: 600; padding: 18px 12px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; padding: 12px; }
  .key { background: #fafafa; border: 1px solid #e0e0e0; border-radius: 8px;
         font-size: 44px; color: #111; text-align: center; padding: 26px 0; }
</style>
</head>
<body>
  <div class="calc">
    <div class="history">52</div>
    <div class="display">0</div>
    <div class="pad">
      <div class="key">7</div><div class="key">8</div><div class="key">9</div>
      <div class="key">4</div><div class="key">5</div><div class="key">6</div>
      <div class="key">1</div><div class="key">2</div><div class="key">3</div>
      <div class="key">CE</div><div class="key">0</div><div class="key">=</div>
    </div>
  </div>
</body>
</html>
