<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>小蛇 · 正在启动</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f9f7; color: #202520; font: 15px/1.8 system-ui, sans-serif; }
    main { max-width: 440px; padding: 32px; }
    h1 { font-size: 24px; font-weight: 600; margin: 0 0 12px; }
    p { margin: 6px 0; color: #5b655e; }
    .indicator { width: 32px; height: 3px; background: #708b7c; margin-bottom: 24px; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .indicator { animation: none; } }
    @media (prefers-color-scheme: dark) { body { background: #202220; color: #edf0ed; } p { color: #b4bcb6; } }
  </style>
</head>
<body>
  <main role="status" aria-live="polite">
    <div class="indicator" aria-hidden="true"></div>
    <h1>正在启动小蛇</h1>
    <p>正在准备本地服务，完成后会自动打开工作台。</p>
    <p>首次启动或更新后可能需要几分钟，无需重复打开。</p>
  </main>
</body>
</html>
